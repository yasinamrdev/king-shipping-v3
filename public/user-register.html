<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | كينج شيبنج</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1628">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', 'Tajawal', sans-serif; background: linear-gradient(160deg, #0a1628 0%, #0f2044 40%, #1a3a6b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .card h1 { font-size: 1.5rem; font-weight: 900; color: #0a1628; margin-bottom: 24px; text-align: center; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #0a1628; margin-bottom: 6px; }
        .form-group input { width: 100%; border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px; font-family: 'Cairo', 'Tajawal', sans-serif; font-size: 0.9rem; transition: all 0.25s; }
        .form-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); outline: none; }
        .btn { width: 100%; background: linear-gradient(135deg, #3b82f6, #1a3a6b); color: white; border: none; padding: 14px; border-radius: 10px; font-family: 'Cairo', 'Tajawal', sans-serif; font-size: 1.05rem; font-weight: 800; cursor: pointer; margin-top: 8px; transition: all 0.25s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,130,246,0.3); }
        .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 10px; font-size: 0.88rem; display: none; margin-bottom: 16px; }
        .error.show { display: block; }
        .success { background: #dcfce7; color: #166534; padding: 12px; border-radius: 10px; font-size: 0.88rem; display: none; margin-bottom: 16px; text-align: center; }
        .success.show { display: block; }
        .link { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #8a97b0; }
        .link a { color: #3b82f6; text-decoration: none; font-weight: 700; }
        .link a:hover { color: #f5a623; }
        @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="card">
        <h1>📝 إنشاء حساب جديد</h1>
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        <form onsubmit="register(event)">
            <div class="row">
                <div class="form-group"><label>الاسم الكامل *</label><input type="text" id="name" placeholder="اسمك الكامل" required></div>
                <div class="form-group"><label>رقم الهاتف *</label><input type="tel" id="phone" placeholder="01xxxxxxxxx" required></div>
            </div>
            <div class="row">
                <div class="form-group"><label>اسم المتجر</label><input type="text" id="storeName" placeholder="اسم متجرك"></div>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" placeholder="example@mail.com"></div>
            </div>
            <div class="form-group"><label>رابط المتجر</label><input type="url" id="storeLink" placeholder="https://yourstore.com"></div>
            <div class="form-group"><label>العنوان</label><input type="text" id="address" placeholder="عنوانك بالتفصيل"></div>
            <div class="row">
                <div class="form-group"><label>كلمة المرور *</label><input type="password" id="password" placeholder="كلمة المرور" required></div>
                <div class="form-group"><label>تأكيد كلمة المرور *</label><input type="password" id="password2" placeholder="أعد كتابة كلمة المرور" required></div>
            </div>
            <button type="submit" class="btn">✅ إنشاء الحساب</button>
        </form>
        <p class="link">لديك حساب بالفعل؟ <a href="user-login.html">سجل دخول</a></p>
        <p class="link"><a href="index.html">🏠 العودة للرئيسية</a></p>
    </div>
    <script>
        async function register(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            errorEl.classList.remove('show');
            successEl.classList.remove('show');
            
            if (password !== password2) {
                errorEl.textContent = 'كلمتا المرور غير متطابقتين';
                errorEl.classList.add('show');
                return;
            }
            
            const body = {
                name: document.getElementById('name').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim(),
                storeName: document.getElementById('storeName').value.trim(),
                storeLink: document.getElementById('storeLink').value.trim(),
                address: document.getElementById('address').value.trim(),
                password: password
            };
            
            try {
                const res = await fetch('/api/user/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                
                if (res.ok) {
                    successEl.textContent = '✅ تم إنشاء الحساب بنجاح! جارٍ تحويلك للرئيسية...';
                    successEl.classList.add('show');
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userData', JSON.stringify(data.user));
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    errorEl.textContent = data.error || 'حدث خطأ في التسجيل';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                errorEl.textContent = 'تعذر الاتصال بالخادم';
                errorEl.classList.add('show');
            }
        }
    </script>
</body>
</html>
